[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbrs-browser"
version = "0.1.0"
description = "Read-only dictionary browser backed by Elasticsearch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaraslau" }]
keywords = ["dictionary", "elasticsearch", "fastapi"]
dependencies = [
    "elasticsearch>=8.13,<9.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
where = ["vbrs-browser"]
include = ["backend*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["vbrs-browser", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "scripts", "conftest"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "vbrs-browser"
files = ["vbrs-browser/backend", "vbrs-browser/scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"